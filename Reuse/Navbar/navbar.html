<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="./Reuse/Navbar/navbar.css">
    </head>
    <body>
        <div class="navbar">
            <div class="left-side">
                <div class="logo">
                    <a href=""><img src="./Reuse/Navbar/logo wr.png" alt=""></a>
                </div>
                <div class="buttons">
                    <a href="../../../Pages/Gallery/gallery.html">Gallery</a>
                    <a href="">Projects</a>
                    <a href="">Comics</a>
                </div>
            </div>
            <div class="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search item...">
            </div>
            <div class="right-side">
                <div class="lan" id ="lan">
                    <button class="lanbtn" id="lanbtnID"><img src="./Reuse/Navbar/Flag_of_England.png" id="flagCur" class="flag" alt=""><span id="curLan">English</span><i class="fa-solid fa-caret-down"></i></button>
                    <div class="dropdown-list" id="dropdownList">
                        <button id="lanButtonTop"><div class="flagDrop"><img src="./Reuse/Navbar/Flag_of_Finland-01.png" id="flag1" class="flag" alt=""><span>Suomeksi</span></div></button>
                        <hr id="line">
                        <button id="lanButtonBottom"><div class="flagDrop"><img src="./Reuse/Navbar/Flag_of_Vietnam.svg.png" id="flag2" class="flag" alt=""><span>Tiếng Việt</span></div></button>
                    </div>
                </div>
                <div class="line2"><span>|</span></div>
                <div class="light-dark" id="themeSwitch">
                    <span id="ldStatus">Light mode</span>
                    <button class="ldbtn" id="LDbtn">
                         <div class="btnOutside">
                            <div class="btnInside"></div>
                         </div>
                    </button>
                </div>
            </div>
        </div>
        <script src="./Reuse/Navbar/navbar.js" async defer type="module"></script>
    </body>
</html>
